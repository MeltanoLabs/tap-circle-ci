### A CI workflow template that runs linting and python testing

name: Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

env:
  FORCE_COLOR: 1

jobs:
  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest
    outputs:
      supported-python-versions: ${{ steps.baipp.outputs.supported_python_classifiers_json_array }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        id: baipp

  test:
    name: Test
    needs: [build-package]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.build-package.outputs.supported-python-versions) }}
      max-parallel: 2

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: ">=0.4.0"

    - name: Test with pytest
      env:
        TAP_CIRCLE_CI_TOKEN: ${{ secrets.TAP_CIRCLE_CI_TOKEN }}
        TAP_CIRCLE_CI_ORG_SLUG: ${{ secrets.TAP_CIRCLE_CI_ORG_SLUG }}
      run: |
        uvx --python ${{ matrix.python-version }} --with tox-uv tox -e ${{ matrix.python-version }}

    - name: Type check with mypy
      run: |
        uvx --python ${{ matrix.python-version }} --with tox-uv tox -e typing
