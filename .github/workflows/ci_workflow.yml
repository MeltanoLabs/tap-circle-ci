### A CI workflow template that runs linting and python testing

name: Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

env:
  FORCE_COLOR: 1

jobs:
  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest
    outputs:
      supported-python-versions: ${{ steps.baipp.outputs.supported_python_classifiers_json_array }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2
        id: baipp

  test:
    name: Test
    needs: [build-package]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.build-package.outputs.supported-python-versions) }}
      max-parallel: 2

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: ">=0.4.0"

    - name: Test with pytest
      env:
        TAP_CIRCLE_CI_TOKEN: ${{ secrets.TAP_CIRCLE_CI_TOKEN }}
        TAP_CIRCLE_CI_ORG_SLUG: ${{ secrets.TAP_CIRCLE_CI_ORG_SLUG }}
      run: |
        uvx --python ${{ matrix.python-version }} --with tox-uv tox -e ${{ matrix.python-version }}

    - name: Type check with mypy
      run: |
        uvx --python ${{ matrix.python-version }} --with tox-uv tox -e typing
